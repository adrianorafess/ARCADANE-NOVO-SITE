    <!-- Inject global error interceptors as early as possible to capture and suppress third-party cross-origin Script errors -->
    <script type="text/javascript">
      (function() {
        var suppress = function(msg, src) {
          var m = String(msg || '').toLowerCase();
          var s = String(src || '').toLowerCase();
          
          // 1. Silent suppression for standard cross-origin script errors carrying no detail
          if (m === 'script error' || m === 'script error.') {
            return true;
          }
          
          // 2. Suppress errors originating from third-party scripts/assets
          var thirdPartyDomains = [
            'google', 'vlibras', 'onertravel', 'befly', 'translate', 
            'gstatic', 'googleapis', 'doubleclick', 'facebook', 'facebook.net',
            'connect.facebook', 'whatsapp', 'recaptcha', 'analytics', 'gtm'
          ];
          for (var i = 0; i < thirdPartyDomains.length; i++) {
            var domain = thirdPartyDomains[i];
            if (s.indexOf(domain) !== -1 || m.indexOf(domain) !== -1) {
              return true;
            }
          }
          
          // 3. Suppress benign browser/extension or widget layout noises
          if (m.indexOf('resizeobserver') !== -1 || m.indexOf('extension') !== -1) {
            return true;
          }

          return false;
        };

        window.addEventListener('error', function(e) {
          if (suppress(e.message, e.filename)) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);

        // Intercept console.error to silence cross-origin script error noise
        var originalConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var argStr = args.map(function(arg) {
            try {
              return typeof arg === 'object' ? JSON.stringify(arg) : String(arg);
            } catch(err) {
              return String(arg);
            }
          }).join(' ').toLowerCase();

          var thirdPartyKeywords = [
            'script error', 'vlibras', 'google', 'onertravel', 'befly', 
            'translate', 'recaptcha', 'facebook', 'whatsapp', 'gtm', 'gtag'
          ];
          for (var i = 0; i < thirdPartyKeywords.length; i++) {
            if (argStr.indexOf(thirdPartyKeywords[i]) !== -1) {
              return;
            }
          }
          return originalConsoleError.apply(console, arguments);
        };

        var prevOnError = window.onerror;
        window.onerror = function(message, source, lineno, colno, error) {
          if (suppress(message, source)) {
            return true;
          }
          if (prevOnError) {
            return prevOnError.apply(window, arguments);
          }
          return false;
        };

        window.addEventListener('unhandledrejection', function(e) {
          var reason = e.reason ? (e.reason.message || String(e.reason)) : '';
          if (suppress(reason, '')) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>

    <!-- Inject global error interceptors as early as possible to capture and suppress third-party cross-origin Script errors -->
    <script type="text/javascript">
      (function() {
        var suppress = function(msg, src) {
          var m = String(msg || '').toLowerCase();
          var s = String(src || '').toLowerCase();
          return !msg || 
                 m.indexOf('script error') !== -1 || 
                 m.indexOf('error') !== -1 ||
                 s.indexOf('google') !== -1 || 
                 s.indexOf('vlibras') !== -1 || 
                 s.indexOf('onertravel') !== -1;
        };

        window.addEventListener('error', function(e) {
          if (suppress(e.message, e.filename)) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);

        // Intercept console.error to silence cross-origin script error noise
        var originalConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var argStr = args.map(function(arg) {
            try {
              return typeof arg === 'object' ? JSON.stringify(arg) : String(arg);
            } catch(err) {
              return String(arg);
            }
          }).join(' ').toLowerCase();

          if (argStr.indexOf('script error') !== -1 || 
              argStr.indexOf('vlibras') !== -1 || 
              argStr.indexOf('google') !== -1 || 
              argStr.indexOf('onertravel') !== -1) {
            return;
          }
          return originalConsoleError.apply(console, arguments);
        };

        var prevOnError = window.onerror;
        window.onerror = function(message, source, lineno, colno, error) {
          if (suppress(message, source)) {
            return true;
          }
          if (prevOnError) {
            return prevOnError.apply(window, arguments);
          }
          return false;
        };

        window.addEventListener('unhandledrejection', function(e) {
          var reason = e.reason ? (e.reason.message || String(e.reason)) : '';
          if (suppress(reason, '')) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
